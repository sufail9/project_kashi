<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Withdraw Money | Project Kashi</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f6fb;
            color: #243247;
        }

        header {
            background: #142d4e;
            color: white;
            padding: 24px 40px;
        }

        header h1 {
            margin: 0 0 8px;
            font-size: 30px;
        }

        header p {
            margin: 0;
            color: #d5e2f0;
        }

        .container {
            max-width: 750px;
            margin: 45px auto;
            padding: 0 20px;
        }

        .heading {
            margin-bottom: 25px;
        }

        .heading h2 {
            color: #142d4e;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .heading p {
            color: #65758b;
            line-height: 1.6;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 5px 22px rgba(20, 45, 78, 0.08);
            border: 1px solid #e6ecf3;
        }

        .card h3 {
            margin-top: 0;
            color: #142d4e;
        }

        .form-group {
            margin-bottom: 23px;
        }

        label {
            display: block;
            margin-bottom: 9px;
            font-weight: 600;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccd6e2;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #087f8c;
            box-shadow: 0 0 0 3px rgba(8, 127, 140, 0.12);
        }

        .amount-box {
            padding: 18px;
            background: #fff7f0;
            border: 1px solid #f5dfcc;
            border-radius: 9px;
        }

        .amount-box label {
            color: #a34c16;
        }

        .buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 28px;
        }

        .btn {
            display: inline-block;
            border: none;
            padding: 13px 20px;
            border-radius: 7px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
        }

        .primary {
            background: #d97732;
            color: white;
        }

        .primary:hover {
            background: #b95d1d;
        }

        .secondary {
            background: #eaf0f8;
            color: #142d4e;
        }

        .secondary:hover {
            background: #dce6f2;
        }

        .note {
            margin-top: 24px;
            padding-top: 18px;
            border-top: 1px solid #e8edf3;
            color: #78869a;
            font-size: 13px;
            line-height: 1.7;
        }

        @media (max-width: 600px) {
            header {
                padding: 22px;
            }

            .card {
                padding: 23px;
            }

            .buttons .btn {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Project Kashi</h1>
        <p>Banking Management System</p>
    </header>

    <main class="container">

        <div class="heading">
            <h2>Withdraw Money</h2>
            <p>
                Withdraw money from an existing active account.
                Enter the account details below.
            </p>
        </div>

        <section class="card">

            <h3>Withdrawal Information</h3>

            <form action="{{ url_for('withdraw_money') }}" method="POST">

                <div class="form-group">
                    <label for="account_id">Account ID</label>

                    <input
                        type="number"
                        id="account_id"
                        name="account_id"
                        placeholder="Enter Account ID"
                        min="1"
                        step="1"
                        required
                    >
                </div>

                <div class="form-group amount-box">
                    <label for="amount">Withdrawal Amount (₹ INR)</label>

                    <input
                        type="number"
                        id="amount"
                        name="amount"
                        placeholder="Enter withdrawal amount"
                        min="0.01"
                        step="0.01"
                        required
                    >
                </div>

                <div class="buttons">
                    <button type="submit" class="btn primary">
                        Withdraw Money
                    </button>

                    <a href="{{ url_for('home') }}"
                       class="btn secondary">
                        Back to Home
                    </a>
                </div>

            </form>

            <div class="note">
                <strong>Important:</strong> Withdrawals are allowed only
                for active accounts with sufficient available balance.
            </div>

        </section>

    </main>

</body>
</html>
